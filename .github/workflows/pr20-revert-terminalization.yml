name: PR20 one-time terminalization repair

on:
  push:
    branches:
      - codex/terminalize-authoritative-response-snapshots
    paths:
      - .github/workflows/pr20-revert-terminalization.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/terminalize-authoritative-response-snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply bounded forced-snapshot repair
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          coord = Path('src/bridge/coordinator/requestRecoveryCoordinator.js')
          text = coord.read_text()

          def replace_once(src, old, new, label):
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return src.replace(old, new, 1)

          text = replace_once(
              text,
              '  responseHasTerminalOutput,\n',
              '',
              'terminal-output import',
          )

          text, count = re.subn(
              r"function authoritativeTerminalSnapshot\(state, response, anchors, turnKey\) \{.*?\n\}\n\n(?=function authoritativeInactiveSnapshot)",
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'authoritativeTerminalSnapshot: expected 1 block, got {count}')

          old_doc = ''' * Owns request recovery evidence, deadline diagnostics, and source
           * reconciliation. Ordinary snapshots are read-only; only a source-bound
           * snapshot with complete terminal evidence may materialize a terminal outcome.
'''
          if old_doc not in text:
              old_doc = ''' * Owns request recovery evidence, deadline diagnostics, and source
 * reconciliation. Ordinary snapshots are read-only; only a source-bound
 * snapshot with complete terminal evidence may materialize a terminal outcome.
'''
          new_doc = ''' * Owns request recovery evidence, deadline diagnostics, and read-only source
 * reconciliation. Forced snapshots may reconcile exact source state, but they
 * never materialize a terminal outcome or repeat writes.
'''
          text = replace_once(text, old_doc, new_doc, 'coordinator ownership comment')

          text, count = re.subn(
              r"\n    if \(authoritativeTerminalSnapshot\(state, response, sourceAnchors, turnKey\).*?\n    \}\n(?=  \}\n\}\n?$)",
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'terminalization block: expected 1 block, got {count}')

          if 'authoritativeTerminalSnapshot' in text or 'forced_snapshot.terminalized' in text:
              raise SystemExit('unsafe terminalization symbols remain')
          if 'authoritativeInactiveSnapshot' not in text:
              raise SystemExit('inactive-generation reconciliation was lost')
          coord.write_text(text)

          test_file = Path('test/requestLifecycleDeadlines.test.js')
          tests = test_file.read_text()
          tests = replace_once(
              tests,
              "test('weak forced snapshots are source-bound read-only reconciliation and cannot terminate the request', async () => {",
              "test('forced snapshots are source-bound read-only reconciliation and cannot terminate the request', async () => {",
              'read-only forced snapshot test title',
          )
          tests, count = re.subn(
              r"test\('authoritative active-request snapshot terminalizes when normalized observation is stale', async \(\) => \{.*?\n\}\);\n\n(?=test\('an exact inactive active-request snapshot demotes generation without terminalizing')",
              '',
              tests,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'terminalization positive test: expected 1 block, got {count}')
          if 'authoritative_forced_snapshot' in tests:
              raise SystemExit('terminalization test residue remains')
          if "an exact inactive active-request snapshot demotes generation without terminalizing" not in tests:
              raise SystemExit('inactive-generation test was lost')
          test_file.write_text(tests)

          old_sentence = (
              'A forced snapshot cannot resend a browser write. An exact active-request snapshot can reconcile generation to stopped without completing the request when its request, lease, owner, response epoch, conversation, and submitted-turn identity match and the page reports generation inactive. Only an exact source-bound snapshot with stopped-generation evidence, final-message evidence, and terminal output can produce canonical completion. Deadline callbacks emit canonical events; they never resolve/reject a request directly.'
          )
          new_sentence = (
              'A forced snapshot is read-only evidence and cannot resend a browser write or terminalize a request. An exact active-request snapshot can reconcile generation to stopped without completing the request when its request, lease, owner, response epoch, conversation, and submitted-turn identity match and the page reports generation inactive. Canonical completion still requires the normal observation/event path. Deadline callbacks emit canonical events; they never resolve/reject a request directly.'
          )
          replaced_docs = 0
          for path in (Path('ARCHITECTURE.md'), Path('CONTEXT.MD')):
              doc = path.read_text()
              if old_sentence in doc:
                  doc = doc.replace(old_sentence, new_sentence, 1)
                  path.write_text(doc)
                  replaced_docs += 1
          if replaced_docs == 0:
              raise SystemExit('snapshot terminalization documentation sentence not found')
          PY
          git diff --check
          ! grep -R "authoritativeTerminalSnapshot\|forced_snapshot\.terminalized\|authoritative_forced_snapshot" src/bridge/coordinator/requestRecoveryCoordinator.js test/requestLifecycleDeadlines.test.js
          grep -q "authoritativeInactiveSnapshot" src/bridge/coordinator/requestRecoveryCoordinator.js
      - name: Validate focused request lifecycle and observations
        run: |
          set -euo pipefail
          npm ci
          npm test -- test/requestLifecycleDeadlines.test.js test/tabObservationAdapter.test.js test/tabObservationCore.test.js
          npm run check
      - name: Commit repair and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr20-revert-terminalization.yml
          git add -A
          git commit -m "fix: keep forced snapshots non-terminal"
          git push origin "HEAD:${GITHUB_REF_NAME}"
