name: PR20 one-time terminalization repair

on:
  push:
    branches:
      - codex/terminalize-authoritative-response-snapshots
    paths:
      - .github/workflows/pr20-revert-terminalization.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/terminalize-authoritative-response-snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply bounded forced-snapshot repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('src/bridge/coordinator/requestRecoveryCoordinator.js'); s=p.read_text(); old='  responseHasTerminalOutput,\\n'; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,'',1))"
          python3 -c "from pathlib import Path; import re; p=Path('src/bridge/coordinator/requestRecoveryCoordinator.js'); s=p.read_text(); s,n=re.subn(r'function authoritativeTerminalSnapshot\\(state, response, anchors, turnKey\\) \\{.*?\\n\\}\\n\\n(?=function authoritativeInactiveSnapshot)', '', s, count=1, flags=re.S); assert n==1,n; p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('src/bridge/coordinator/requestRecoveryCoordinator.js'); s=p.read_text(); old=' * Owns request recovery evidence, deadline diagnostics, and source\\n * reconciliation. Ordinary snapshots are read-only; only a source-bound\\n * snapshot with complete terminal evidence may materialize a terminal outcome.\\n'; new=' * Owns request recovery evidence, deadline diagnostics, and read-only source\\n * reconciliation. Forced snapshots may reconcile exact source state, but they\\n * never materialize a terminal outcome or repeat writes.\\n'; assert s.count(old)==1,s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; import re; p=Path('src/bridge/coordinator/requestRecoveryCoordinator.js'); s=p.read_text(); s,n=re.subn(r'\\n    if \\(authoritativeTerminalSnapshot\\(state, response, sourceAnchors, turnKey\\).*?\\n    \\}\\n(?=  \\}\\n\\}\\n)', '\\n', s, count=1, flags=re.S); assert n==1,n; p.write_text(s)"
          python3 -c "from pathlib import Path; p=Path('test/requestLifecycleDeadlines.test.js'); s=p.read_text(); old=\"test('weak forced snapshots are source-bound read-only reconciliation and cannot terminate the request', async () => {\"; new=\"test('forced snapshots are source-bound read-only reconciliation and cannot terminate the request', async () => {\"; assert s.count(old)==1,s.count(old); p.write_text(s.replace(old,new,1))"
          python3 -c "from pathlib import Path; import re; p=Path('test/requestLifecycleDeadlines.test.js'); s=p.read_text(); pat=r\"test\\('authoritative active-request snapshot terminalizes when normalized observation is stale', async \\(\\) => \\{.*?\\n\\}\\);\\n\\n(?=test\\('an exact inactive active-request snapshot demotes generation without terminalizing')\"; s,n=re.subn(pat,'',s,count=1,flags=re.S); assert n==1,n; p.write_text(s)"
          python3 -c "from pathlib import Path; old='Only an exact source-bound snapshot with stopped-generation evidence, final-message evidence, and terminal output can produce canonical completion.'; new='Forced snapshots never terminalize requests; canonical completion still requires the normal observation/event path.'; hits=0; [((lambda s: (p.write_text(s.replace(old,new,1)),1)[1] if old in s else 0)(p.read_text())) for p in map(Path,['ARCHITECTURE.md','CONTEXT.MD'])]; assert all('Only an exact source-bound snapshot with stopped-generation evidence, final-message evidence, and terminal output can produce canonical completion.' not in Path(x).read_text() for x in ['ARCHITECTURE.md','CONTEXT.MD'])"
          git diff --check
          ! grep -R "authoritativeTerminalSnapshot\|forced_snapshot\.terminalized\|authoritative_forced_snapshot" src/bridge/coordinator/requestRecoveryCoordinator.js test/requestLifecycleDeadlines.test.js
          grep -q "authoritativeInactiveSnapshot" src/bridge/coordinator/requestRecoveryCoordinator.js
          grep -q "an exact inactive active-request snapshot demotes generation without terminalizing" test/requestLifecycleDeadlines.test.js
      - name: Validate focused request lifecycle and observations
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test -- test/requestLifecycleDeadlines.test.js test/tabObservationAdapter.test.js test/tabObservationCore.test.js
          npm run check
      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr20-revert-terminalization.yml
          git add -A
          git commit -m "fix: keep forced snapshots non-terminal"
          git push origin "HEAD:${GITHUB_REF_NAME}"
